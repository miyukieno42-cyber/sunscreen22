<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>あなたについて教えてください</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<main class="survey-card">


    <!-- =========================
         ヘッダー
    ========================== -->

    <header class="survey-header">

        <h1>
            あなたについて教えてください
        </h1>


        <div class="progress-area">

            <div class="progress-text">

                <span id="progress-current">
                    1
                </span>

                /

                <span id="progress-total">
                    1
                </span>

            </div>


            <div class="progress-bar">

                <div
                    id="progress-fill"
                    class="progress-fill"
                ></div>

            </div>

        </div>

    </header>


    <!-- =========================
         質問表示エリア
    ========================== -->

    <div id="question-container"></div>


    <!-- =========================
         ボタン
    ========================== -->

    <div class="button-area">

        <button
            type="button"
            id="back-button"
            class="back-button"
        >
            戻る
        </button>


        <button
            type="button"
            id="next-button"
            class="next-button"
        >
            次へ
        </button>

    </div>


</main>


<script
    src="{{ url_for('static', filename='app.js') }}"
></script>


</body>

</html>
